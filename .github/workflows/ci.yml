name: Verify Talyn
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_USER: talyn
          POSTGRES_PASSWORD: local-demo-only
          POSTGRES_DB: talyn_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U talyn" --health-interval 5s
          --health-timeout 5s --health-retries 12
    env:
      TALYN_MODE: demo
      TALYN_LIVE_EMAIL: 'false'
      LANGSMITH_TRACING: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.11.32
          cd backend
          uv sync --frozen
          cd ../frontend
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          cd ../infra
          npm ci --no-audit --no-fund
      - name: Backend checks and migrations
        working-directory: backend
        run: |
          uv run ruff check app tests
          uv run pytest -q
          TALYN_TEST_DATABASE_URL=postgresql+psycopg://talyn:local-demo-only@127.0.0.1:5432/talyn_test uv run pytest -q
          uv run alembic upgrade head
          uv run alembic check
          uv run python ../scripts/create_fixtures.py
      - name: Frontend checks and production build
        working-directory: frontend
        run: |
          npm run typecheck
          npm run test:audio
          npm run build
          npm run test:e2e
      - name: Infrastructure assertions and synthesis
        working-directory: infra
        run: |
          npm run build
          npm test
          npx cdk synth --quiet -c domain=talyn.example.com -c certificateArn=arn:aws:acm:ap-south-1:111111111111:certificate/00000000-0000-0000-0000-000000000000 -c senderEmail=sender@example.com
          npx cdk synth --quiet -c runtime=true -c ingress=cloudfront -c senderEmail=sender@example.com -c cloudFrontPrefixListId=pl-00000000000000000
          npx cdk synth --quiet -c runtime=true -c ingress=ip -c senderEmail=sender@example.com
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-evidence
          path: |
            frontend/test-results
            frontend/playwright-report
          retention-days: 7
