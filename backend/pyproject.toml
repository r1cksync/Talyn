[project]
name = "talyn-api"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0.38,<2.1", "alembic>=1.15,<2", "psycopg[binary,pool]>=3.2,<4",
  "boto3>=1.37,<2", "amazon-transcribe>=0.6.4,<0.7", "pyjwt[crypto]>=2.10,<3",
  "langgraph>=1,<2", "langgraph-checkpoint-postgres>=3,<4", "langgraph-checkpoint-sqlite>=3,<4",
  "httpx>=0.28,<1", "python-multipart>=0.0.20,<1", "pypdf>=5.4,<7",
  "python-docx>=1.1,<2", "defusedxml>=0.7,<1", "email-validator>=2.2,<3", "cryptography>=44",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
